<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>유럽 1939</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 작전 지도 테이블: 누렇게 바랜 참모 지도 위에 국가별 색 블록을 올린다. */
:root{
  --paper:#E8E1CF; --sheet:#F6F2E7; --ink:#1F2429; --mute:#5E625F; --line:#C9BFA6;
  --sea:#BCD2DC; --seaink:#2D5569; --neu:#D6CCB1; --neuink:#3B372C; --void:#A6A6A0;
  --hot:#B42A1F; --ok:#2F6B45; --gold:#8F6A12; --river:#3E7FB0;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181C; --sheet:#1E2227; --ink:#E4E1D8; --mute:#9A9C98; --line:#353A40;
  --sea:#1C3441; --seaink:#9CC4D6; --neu:#4A4536; --neuink:#EDE6D2; --void:#3A3C3F;
  --hot:#EF6B5E; --ok:#71C38F; --gold:#D8B45C; --river:#6BA8D6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181C; --sheet:#1E2227; --ink:#E4E1D8; --mute:#9A9C98; --line:#353A40;
  --sea:#1C3441; --seaink:#9CC4D6; --neu:#4A4536; --neuink:#EDE6D2; --void:#3A3C3F;
  --hot:#EF6B5E; --ok:#71C38F; --gold:#D8B45C; --river:#6BA8D6; color-scheme:dark}
*{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body)}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);border-radius:6px;padding:7px 12px;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.red{background:var(--hot);border-color:var(--hot);color:#fff}
button.sm{padding:3px 9px;font-size:13px}
button.on{outline:2px solid var(--gold);outline-offset:1px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink)}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
header.top h1{font:400 26px/1 var(--f-display);margin:0;letter-spacing:.5px}
header.top .sp{flex:1}
.mono{font-family:var(--f-mono)}
.mute{color:var(--mute)} .note{color:var(--mute);font-size:13px}
.wrap{max-width:1480px;margin:0 auto;padding:12px 16px 40px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.sheet h2{font:400 22px/1.2 var(--f-display);margin:0 0 8px}
.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--mute);margin-bottom:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.code{font:600 26px/1 var(--f-mono);letter-spacing:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--hot);border-color:var(--hot)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute)} .dot.on{background:var(--ok)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.seat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet);border-left-width:6px}
.seat.mine{box-shadow:0 0 0 2px var(--gold)}
.seat ul{margin:6px 0;padding-left:18px;font-size:13px;color:var(--mute)}
#achBtn{font-size:13px}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:62vh;overflow:auto;padding:2px}
.achc{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--sheet)}
.achc b{display:block;font-size:13px;margin-top:4px}.achc span{display:block;font-size:11.5px;color:var(--mute);line-height:1.35}
.achc.lock{opacity:.55}.achc.lock svg{filter:grayscale(1) brightness(.85)}
.achpop{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--sheet);padding:10px 14px 10px 10px;border-radius:12px;border:2px solid #E2B54A;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:achin 4.2s ease forwards;max-width:min(360px,calc(100vw - 32px))}
.achpop small{display:block;color:#E2B54A;font-weight:700;letter-spacing:.06em;font-size:11px}
@keyframes achin{0%{transform:translateY(30px) scale(.9);opacity:0}8%{transform:none;opacity:1}88%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.modal.achmodal .sheet{max-width:820px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw;font-weight:600}
/* 게임 화면 */
.game{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start}
@media (max-width:980px){.game{grid-template-columns:minmax(0,1fr)}}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .big{font:400 22px/1 var(--f-display)}
.flag{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.stat{font-family:var(--f-mono);font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:transparent;color:var(--mute);border-color:var(--line)}
.tabs button.act{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.units{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.unit{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 8px;border:1px solid var(--line);border-radius:6px}
.hpbar{display:inline-block;width:46px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--ok)}
.log{max-height:260px;overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:3px}
.chat{max-height:200px;overflow:auto;font-size:14px;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fo{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.fo.done{opacity:.55} .fo.cur{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.fo b{font-size:14px}
.pv{border:2px solid var(--hot);border-radius:10px;padding:10px 12px;margin-top:8px}
.pv table{width:100%;border-collapse:collapse;font-size:13px}
.pv td{padding:2px 4px;vertical-align:top}
.brk{font-size:12px;color:var(--mute)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal .sheet{max-width:460px;width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
#hurry{position:fixed;inset:0;pointer-events:none;border:6px solid var(--hot);z-index:30;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#hurry{animation:none}}
/* 지도 */
:root{--ocean:#7FA6B8;--ocean2:#6C94A8;--sea:#A7C6D3;--sea-h:#B9D5E0;--seaink:#2B5366;--wave:rgba(255,255,255,.55);--shore:#EFE6CC;--shore2:#FBF6E8;
  --offland:#CBC3AC;--offl:rgba(90,80,60,.25);--void:#A5A49C;--voidl:#8D8C84;--neu:#DDD3B5;--grat:rgba(255,255,255,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ocean:#0E1E27;--ocean2:#0B1920;--sea:#17313D;--sea-h:#1E3C4A;--seaink:#8FBBD0;--wave:rgba(160,210,235,.22);--shore:#29485A;--shore2:#35596B;
  --offland:#2A2C2B;--offl:rgba(255,255,255,.07);--void:#3A3B3C;--voidl:#303132;--neu:#5B5543;--grat:rgba(255,255,255,.05)}}
:root[data-theme="dark"]{--ocean:#0E1E27;--ocean2:#0B1920;--sea:#17313D;--sea-h:#1E3C4A;--seaink:#8FBBD0;--wave:rgba(160,210,235,.22);--shore:#29485A;--shore2:#35596B;
  --offland:#2A2C2B;--offl:rgba(255,255,255,.07);--void:#3A3B3C;--voidl:#303132;--neu:#5B5543;--grat:rgba(255,255,255,.05)}
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.mapwrap{overflow:auto;-webkit-overflow-scrolling:touch;cursor:grab;max-height:78vh;background:var(--ocean)}
.mapwrap.drag{cursor:grabbing}
#gmap{display:block;width:100%;min-width:760px;height:auto;user-select:none;-webkit-user-select:none}
.ztools{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.ztools button{background:var(--sheet);width:34px;height:34px;padding:0;font-size:18px}
#banner{position:absolute;left:0;right:0;top:40%;pointer-events:none;text-align:center;z-index:3}
#banner .bn{display:inline-block;padding:10px 30px;font:400 28px/1.2 var(--f-display);color:#fff;background:rgba(20,22,26,.82);border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);animation:ban 2.5s ease forwards;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#banner .bn.war{background:rgba(120,14,10,.88);border-color:#FFB199}
#banner .bn.focus{font-size:20px;background:rgba(30,40,30,.85)}
@keyframes ban{0%{transform:translateX(-80px);opacity:0}14%{transform:none;opacity:1}78%{transform:none;opacity:1}100%{transform:translateX(80px);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
.optg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.optg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}.optg select{color:var(--ink)}
.capb{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:13px}.capb b{font-family:var(--f-mono)}
.capb.near{border-color:var(--gold);color:var(--gold)}.capb.full{border-color:var(--hot);color:var(--hot);animation:pulse 1.2s ease-in-out infinite}
.capm{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px;font-size:14px}.capm b{font-family:var(--f-mono)}
.bar2{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.bar2 i{display:block;height:100%;background:var(--ok);transition:width .4s}
.capm.near .bar2 i{background:var(--gold)}.capm.full .bar2 i{background:var(--hot)}.capm.full{border-color:var(--hot)}
.roomk{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px}
.roomk b{font:400 22px var(--f-display)}.roomk span{font-weight:400;font-size:13px;opacity:.85}
.drawsheet{text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,rgba(201,154,62,.18),transparent 70%),var(--sheet)}
.stage{--cw:clamp(60px,16.5vw,132px);--ch:calc(var(--cw)*1.45);position:relative;height:calc(var(--ch) + 70px);margin:18px auto 6px;perspective:900px;max-width:760px}
.card{position:absolute;left:50%;top:14px;width:var(--cw);height:var(--ch);padding:0;border:0;background:none;color:inherit;cursor:default;
  transform:translateX(calc(-50% + var(--i)*var(--cw)*1.1)) translateY(calc(var(--a)*9px)) rotate(calc(var(--i)*5deg));transition:transform .75s cubic-bezier(.2,.9,.25,1.15);z-index:calc(5 - var(--a))}
.card:disabled{opacity:1;cursor:default}
.card.stack{transform:translateX(-50%) rotate(0);animation:riffle .38s ease-in-out infinite alternate;animation-delay:calc(var(--k)*-.08s)}
.card.gather{transform:translateX(-50%) rotate(0);transition:none}
.card.stack:nth-child(even){animation-direction:alternate-reverse}
@keyframes riffle{0%{transform:translateX(calc(-50% - var(--cw)*.55)) translateY(-4px) rotate(-9deg)}100%{transform:translateX(calc(-50% + var(--cw)*.55)) translateY(4px) rotate(9deg)}}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.4,.4,1)}
.card.can{cursor:pointer}
.card.can:hover .inner{transform:translateY(-14px) scale(1.05)}
.card.flip .inner{transform:rotateY(180deg)}
.card.minec .inner{transform:rotateY(180deg) translateY(-16px) scale(1.08)}
.card.minec .front{box-shadow:0 0 0 3px #FFD34D,0 0 28px rgba(255,211,77,.8)}
.back,.front{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.back{background:repeating-linear-gradient(45deg,#7A1E16 0 6px,#8E271D 6px 12px);border:3px solid #E9C46A;display:flex;align-items:center;justify-content:center}
.bem{width:62%;aspect-ratio:1;border-radius:50%;border:2px solid #E9C46A;background:#1F2A3A;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#E9C46A;font:400 13px var(--f-display);gap:2px}
.card.can .back{animation:cglow 1.3s ease-in-out infinite}
@keyframes cglow{50%{box-shadow:0 0 0 3px rgba(255,211,77,.7),0 6px 16px rgba(0,0,0,.35)}}
.front{transform:rotateY(180deg);overflow:hidden;border:3px solid #E9C46A}
.cfx{position:absolute;inset:0;background:linear-gradient(160deg,var(--c),#15181C 140%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
.cfx b{font:400 clamp(16px,3.6vw,26px)/1 var(--f-display);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.cfl,.csp,.ccap{font-size:clamp(9px,1.6vw,12px);opacity:.9}
.cfl{letter-spacing:2px}
.who{position:absolute;left:0;right:0;bottom:-24px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.minec .who{color:var(--gold)}
.card.voidc .front{filter:grayscale(.9) brightness(.7)}.card.voidc .who{color:var(--mute);font-weight:400}
@media (prefers-reduced-motion:reduce){.card.stack{animation:none}.card .inner,.card{transition-duration:.01s}}
.order{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.oc{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--sheet)}
.oc i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.oc b{font-family:var(--f-mono);font-weight:600}
.oc small{color:var(--mute)}
.oc.now{border-color:var(--c);box-shadow:0 0 0 2px var(--c);animation:ocg 1.6s ease-in-out infinite}
.oc.out{opacity:.45;text-decoration:line-through}
@keyframes ocg{50%{box-shadow:0 0 0 4px var(--c)}}
.grat line{stroke:var(--grat);stroke-width:1;stroke-dasharray:2 5}
.szp{fill:var(--sea);stroke:rgba(255,255,255,.28);stroke-width:1.2;stroke-dasharray:5 5;cursor:pointer;transition:fill .25s}
.szp:hover{fill:var(--sea-h)}
.szp.ctl{stroke-width:2.5;stroke-dasharray:10 6;stroke-opacity:.9}
.wvp{fill:none;stroke:var(--wave);stroke-width:1.3;stroke-linecap:round}
.shore1{fill:none;stroke:var(--shore);stroke-width:9;stroke-linejoin:round;opacity:.55}
.shore2{fill:none;stroke:var(--shore2);stroke-width:3.5;stroke-linejoin:round;opacity:.8}
.off{fill:var(--offland)}
.offl{font:italic 600 13px var(--f-body);fill:var(--mute);opacity:.7;letter-spacing:2px}
.lake{fill:var(--sea);stroke:var(--shore2);stroke-width:1.5}
.ter{stroke:rgba(25,20,12,.55);stroke-width:1.1;stroke-linejoin:round;cursor:pointer;transition:fill .7s ease,filter .2s}
.ter:hover{filter:brightness(1.13) saturate(1.1)}
.ter.void{cursor:not-allowed}
.ter.now{animation:nowg 2.4s ease-in-out infinite}
@keyframes nowg{50%{filter:brightness(1.12)}}
.decor .dm{fill:rgba(40,28,15,.28);stroke:rgba(30,20,10,.35);stroke-width:.8;stroke-linejoin:round}
.decor .ds{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.6;stroke-linejoin:round}
.decor .dh{fill:none;stroke:rgba(30,20,10,.3);stroke-width:1.5;stroke-linecap:round}
.decor .dp{fill:none;stroke:rgba(30,40,10,.17);stroke-width:1.2;stroke-linecap:round}
.rv1{fill:none;stroke:#2F6E9E;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.rv2{fill:none;stroke:#9ED0F0;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7;animation:flow 2.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.strait{stroke:#fff;stroke-width:2.5;stroke-dasharray:3 4;opacity:.9}
.nm{font-family:var(--f-body);font-weight:700;fill:#fff;stroke:rgba(15,12,8,.72);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.nm.lt{fill:#2B2618;stroke:rgba(255,250,235,.85)}
.nm.dim{fill:rgba(255,255,255,.55);stroke:rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nm.lt{fill:#F4EEDA;stroke:rgba(0,0,0,.7)}}
:root[data-theme="dark"] .nm.lt{fill:#F4EEDA;stroke:rgba(0,0,0,.7)}
.snm{font:italic 600 12px var(--f-body);fill:var(--seaink);letter-spacing:1.5px;stroke:var(--sea);stroke-width:3px;paint-order:stroke}
.chip{stroke:#fff;stroke-width:1.1;stroke-opacity:.9}
.cn{font:700 11.5px var(--f-mono);fill:#fff}
.capstar{fill:#FFD34D;stroke:#5a3d00;stroke-width:1;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{fill:#FFF1B0}}
.fac{fill:#2E2A26;stroke:#fff;stroke-width:.9;stroke-linejoin:round}
.smoke circle{fill:rgba(235,235,235,.85);opacity:0;animation:puff 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.85}100%{transform:translate(5px,-15px) scale(1.7);opacity:0}}
.warn path{fill:#FFCC33;stroke:#6b1d00;stroke-width:1.2;stroke-linejoin:round}.warn text{font:900 9px var(--f-body);fill:#6b1d00}.warn{animation:pulse 1s ease-in-out infinite}
.hubi rect{fill:#8A5A2B;stroke:#fff;stroke-width:1.2}.hubi path{stroke:#FFE2B0;stroke-width:1.3}
.nosup{font:800 9px var(--f-body);fill:#FFD0C8;stroke:#7A0E06;stroke-width:2.6px;paint-order:stroke}
.fort{font:700 9px var(--f-body);fill:#FFE9A8;stroke:#3a2a00;stroke-width:2.5px;paint-order:stroke}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.cloud{animation:drift 90s linear infinite}
@keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(1500px)}}
.clouds{opacity:.55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .clouds{opacity:.12}}
:root[data-theme="dark"] .clouds{opacity:.12}
.grainr{opacity:.35;mix-blend-mode:multiply}
.cart rect{fill:rgba(245,236,212,.92);stroke:#6B5a36;stroke-width:1.5}
.cart rect.in{fill:none;stroke-width:.8}
.cart .t1{font:400 24px var(--f-display);fill:#3A2E18;letter-spacing:3px}
.cart .t2{font:600 10px var(--f-body);fill:#6B5a36;letter-spacing:2px}
.compass .c1{fill:rgba(245,236,212,.25);stroke:rgba(255,255,255,.6)}
.compass .c2{fill:none;stroke:rgba(255,255,255,.45);stroke-dasharray:2 3}
.compass .cn{fill:#B42A1F;stroke:#fff;stroke-width:.8}
.compass .cs{fill:rgba(255,255,255,.8)}
.compass text{font:700 12px var(--f-body);fill:#fff}
.nshade{fill:#040A18;opacity:0;transition:opacity .9s ease}

function airSpec(x,t,s){const sp=Object.assign({},AIR[t],(AIRV[x]||{})[t]||{});s=s||G||V;if(!s||!s.N||!s.N[x])return sp;const h=id=>has(s,x,id);

  if(t==='fighter'){if(h('jet'))sp.navB+=1;if(h('ftrlead'))sp.r-=1;if(h('standard'))sp.sc-=1;if(h('special'))sp.sc+=1}
  if(t==='bomber'){if(h('bmblead'))sp.r-=1;if(h('siluranti'))sp.torpB+=1;if(h('standard'))sp.torpB-=1;if(h('special'))sp.torpB+=1}

const has=(s,x,id)=>!!(s.N[x]&&s.N[x].done.includes(id));
function topOf(s,x){const n=s.N[x];return n&&n.st==='puppet'&&n.m?n.m:x}

function pactOf(s,x){return(s.pacts||[]).find(P=>P.a===x||P.b===x)||null}
function pactName(P){return`${CAPN[P.a]}-${CAPN[P.b]} 연합군`}
function pactBonus(s,x){if(!s||!s.N||!s.N[x])return null;const P=pactOf(s,topOf(s,x));return P?P.bonus:null}
const PACT_U={inf:'보병',arm:'기갑',art:'포병',flt:'함대'};
function pactBonusPool(a,b){const L=[];for(const k of ['pow','cost']){L.push({k,u:'sp'});for(const u in PACT_U)L.push({k,u})}
  L.push({k:'airdmg'},{k:'aircost'});if(a==='IT'||b==='IT')L.push({k:'torp'});return L}
function pactBonusText(P){const b=P.bonus;const sp=`특유 유닛(${UT[NAT[P.a].sp].n}·${UT[NAT[P.b].sp].n})`;const un=b.u==='sp'?sp:PACT_U[b.u];

  if(pactOf(s,x))return'이미 연합군에 속해 있습니다 (한 번만 결성 가능)';if(pactOf(s,y))return`${NAT[y].n}은(는) 이미 연합군에 속해 있습니다`;
  if(s.war[wk(x,y)]!=null)return'선전포고한(전쟁 중인) 상대와는 연합군을 만들 수 없습니다';return null}
function teamName(t){if(typeof t==='string'&&t[0]==='P'){const s=G||V;const P=s&&(s.pacts||[]).find(P=>'P'+P.id===t);if(P)return pactName(P)}return t==='N'?'중립국':FACN[t]||(NAT[t]?NAT[t].n:t)}
const wk=(a,b)=>[a,b].sort().join('|');
function atWar(s,a,b){
  if(b==='X'||a===b||!s.N[a])return false;if(b==='N')return true;if(!s.N[b])return false;
  const A=topOf(s,a),B=topOf(s,b);if(A===B)return false;const fa=s.N[A].fac;if(fa&&fa===s.N[B].fac)return false;{const P=pactOf(s,A);if(P&&(P.a===B||P.b===B))return false}
  const r=s.war[wk(A,B)];return r!=null&&r<s.rd;

function rulesSheet(){return`<section class="sheet"><span class="lab">빠른 규칙</span><div class="grid2" style="font-size:14px">
 <div><b>목표</b><br>내 진영(연합국·추축국·코민테른, 무소속이면 나 혼자)이 유럽의 모든 땅을 차지하면 승리. 중립국도 모두 점령해야 합니다. 방 설정에서 ‘다른 플레이어만 멸망시키면 승리’로 바꿀 수 있습니다. <b>100라운드가 지나면 모든 지도자가 노환으로 사망해 게임 오버</b>입니다.</div>

 <div><b>병력</b><br>보병 3·파워2·이동2 / 기갑 8·4·3 / 포병 6·4·1 / 함대 8·3·1. 한 땅에 한 종류, 최대 5부대. 한 부대 늘 때마다 파워 +1.</div>

  LAND.forEach((a,i)=>{const p=document.getElementById('tp'+i);if(!p)return;const o=s.T[a[0]].o;p.style.fill=ownerFill(o);p.classList.toggle('now',s.ph==='play'&&o===s.cur);p.classList.toggle('void',o==='X')});

  const svg=document.getElementById('gmap');svg.style.width=(100*mz)+'%';svg.style.minWidth=(760*mz)+'px';

function queueFx(v){if(!Array.isArray(v.fx))return;if(v.gen!==fxGen){fxGen=v.gen;fxSeen=-1}
  const mx=v.fx.reduce((a,f)=>Math.max(a,f.n),0);if(fxSeen<0){fxSeen=mx;return}
  for(const f of v.fx)if(f.n>fxSeen)pendFx.push(f);fxSeen=Math.max(fxSeen,mx)}
function flushFx(){const L=document.getElementById('gFx');if(!L){pendFx=[];return}

function fxAdd(svg,ms){const L=document.getElementById('gFx');if(!L)return;L.insertAdjacentHTML('beforeend',svg);const el=L.lastElementChild;setTimeout(()=>{try{el.remove()}catch(e){}},ms||2600)}
function playFx(f){const col=MAPC[f.x]||'#8A7F5C';
  if(f.k==='neu'){showBanner(`중립국 진격! (${f.m}곳)`,'war');sfx('war');return}
  if(f.k==='pact'){showBanner(`🤝 ${f.m} 결성 · ${f.b}`,'focus');sfx('cap');return}
  if(f.k==='old'){showBanner('💀 노환으로 사망 · GAME OVER','war');sfx('bad');return}
  if(f.k==='trade'){showBanner(`거래 성사 · ${NAT[f.x].n} ↔ ${NAT[f.y].n}`,'focus');sfx('cap');return}
  if(f.k==='atk'||f.k==='mv'){const a=anc(f.f),b=anc(f.t);if(!a||!b)return;const c=curve(a,b,f.k==='atk'?.2:.14);const[bx,by]=b;
    const hx=bx-c.ux*2,hy=by-c.uy*2,px=-c.uy,py=c.ux;const head=`M${hx+c.ux*6} ${hy+c.uy*6}L${hx-c.ux*9+px*8} ${hy-c.uy*9+py*8}L${hx-c.ux*9-px*8} ${hy-c.uy*9-py*8}Z`;
    let g=`<g class="fxg"><path d="${c.d}" class="fx-arr" style="stroke:${shade(col,.55)};stroke-width:${f.k==='atk'?9:7};--len:${c.len};stroke-dasharray:${c.len}"/><path d="${c.d}" class="fx-arr" style="stroke:${col};stroke-width:${f.k==='atk'?5:3.5};--len:${c.len};stroke-dasharray:${c.len}"/><path d="${head}" class="fx-head" style="fill:${col}"/>`;
    if(f.k==='atk'){g+=`<g transform="translate(${bx},${by})"><circle r="16" class="fx-b1"/><circle r="10" class="fx-b2"/><circle r="22" class="fx-ring"/>${[0,1,2,3,4,5,6,7].map(i=>{const an=i*Math.PI/4+.3;return`<line x1="${Math.cos(an)*8}" y1="${Math.sin(an)*8}" x2="${Math.cos(an)*24}" y2="${Math.sin(an)*24}" class="fx-sp"/>`}).join('')}</g>`;
      g+=`<text x="${bx+14}" y="${by-8}" class="fx-dmg">-${f.a}</text><text x="${a[0]-14}" y="${a[1]-8}" class="fx-dmg d2" text-anchor="end">-${f.d}</text>`;
      if(f.c)g+=`<text x="${bx}" y="${by+36}" text-anchor="middle" class="fx-cap" style="fill:${col}">점령!</text>`}
    fxAdd(g+'</g>',2600);if(f.k==='atk'){setTimeout(()=>{sfx('boom');const w=document.querySelector('.mapbox');if(w){w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}},420)}
    if(f.c)setTimeout(()=>ripple(f.t,col),700);return}
  if(f.k==='cap'){ripple(f.t,col);return}
  if(f.k==='ls'){showBanner(f.ok?`수도 탈환! ${NAT[f.x].n} 결사항전 성공`:`결사항전! ${NAT[f.x].n}의 수도 ${f.t} 함락`,f.ok?'focus':'war');sfx(f.ok?'cap':'war');if(!f.ok)ripple(f.t,'#B42A1F');return}
  if(f.k==='spy'){showBanner(f.m==='fail'?`🚨 스파이 체포 · ${NAT[f.x].n} 요원이 ${NAT[f.y].n}에서 붙잡힘`:`🕵 첩보 · ${NAT[f.x].n} → ${NAT[f.y].n} · ${f.m==='cap'?'🏳 '+NAT[f.y].n+' 항복!':f.m==='cash'?'자본 '+f.a+' 탈취':f.m==='fac'?f.t+' 공장 파괴':f.t+' 인구 -1'}`,'focus');sfx('notify');if(f.t){const a=anc(f.t);if(a)fxAdd(`<g transform="translate(${a[0]},${a[1]})"><circle r="9" class="fx-bld" style="stroke:#2B2B2B"/><text y="-22" text-anchor="middle" class="fx-plus" style="fill:#2B2B2B">🕵 ${f.m==='fac'?'공장 파괴':'인구 -1'}</text></g>`,2200)}return}
  if(f.k==='nuke'){nukeFx(f);return}
  if(f.k==='air'){airFx(f);return}
  if(f.k==='pop'){const a=anc(f.t);if(!a)return;fxAdd(`<g transform="translate(${a[0]},${a[1]})"><circle r="8" class="fx-bld" style="stroke:#FFD36B"/><circle r="8" class="fx-bld" style="stroke:#FFD36B;animation-delay:.25s"/><text y="-22" text-anchor="middle" class="fx-plus" style="fill:#C98A10">인구 ${'●'.repeat(f.p)}</text></g>`,1900);sfx('focus');return}
  if(f.k==='loot'){const a=anc(f.t);if(!a)return;fxAdd(`<g transform="translate(${a[0]},${a[1]})"><text y="-34" text-anchor="middle" class="fx-plus" style="fill:#B42A1F;animation-delay:.9s">약탈! +${LOOT_RES}</text></g>`,2800);return}
  if(f.k==='build'){const a=anc(f.t);if(!a)return;fxAdd(`<g transform="translate(${a[0]},${a[1]})"><circle r="6" class="fx-bld" style="stroke:${col}"/><text y="-18" text-anchor="middle" class="fx-plus" style="fill:${col}">+${esc(f.u)}</text></g>`,1800);return}
  if(f.k==='war'){showBanner(`⚔ ${NAT[f.x].n} → ${NAT[f.t].n} 선전포고`,'war');sfx('war');return}
  if(f.k==='focus'){showBanner(`${NAT[f.x].n} · ${f.t}`,'focus');return}}
function nukeFx(f){const a=anc(f.t);if(!a)return;const[x,y]=a;showBanner(`☢ 핵 공격 · ${NAT[f.x].n} → ${f.t}`,'war');sfx('nuke');
  const w=document.querySelector('.mapbox');if(w){w.classList.remove('shake','bigshake');void w.offsetWidth;w.classList.add('bigshake')}
  fxAdd(`<g><rect width="${MAP.W}" height="${MAP.H}" class="nk-flash"/><g transform="translate(${x},${y})">
   <circle r="12" class="nk-wave"/><circle r="12" class="nk-wave" style="animation-delay:.25s"/>
   <circle r="16" class="nk-fire"/>
   <g transform="scale(1.7)"><g class="nk-rise"><path d="M-7 0C-5-20-6-40-4-58h8c2 18 1 38 3 58z" class="nk-stem"/><ellipse cx="0" cy="-34" rx="20" ry="5" class="nk-skirt"/>
    <g class="nk-cap"><circle cx="0" cy="-66" r="20"/><circle cx="-18" cy="-60" r="15"/><circle cx="18" cy="-60" r="15"/><circle cx="-9" cy="-78" r="14"/><circle cx="10" cy="-79" r="14"/><circle cx="0" cy="-58" r="13" class="hot"/></g></g></g>
   <text y="34" text-anchor="middle" class="fx-cap" style="fill:#7CFF4F;animation-delay:1.4s">☢</text></g></g>`,6200)}
function airFx(f){const b=anc(f.t),a0=anc(f.f)||b;if(!b)return;const col=MAPC[f.x]||'#888';sfx('jet');
  const ang=Math.atan2(b[1]-a0[1],b[0]-a0[0])*180/Math.PI;const dx=b[0]-a0[0],dy=b[1]-a0[1];
  const plane=c=>`<path d="M10 0 2-2-3-9H-6l2 7-7 1-3-4h-2l1.5 5-1.5 5h2l3-4 7 1-2 7h3l5-7z" style="fill:${c}" stroke="#fff" stroke-width=".8"/>`;
  let g=`<g class="fxg2"><g style="--dx:${dx}px;--dy:${dy}px" class="fly"><g transform="translate(${a0[0]},${a0[1]}) rotate(${ang})">${plane(col)}</g></g>`;
  if(f.m==='int'){g+=`<g transform="translate(${b[0]+30},${b[1]-30}) rotate(${ang+180})" class="popin">${plane(MAPC[f.y]||'#888')}</g><text x="${b[0]}" y="${b[1]-30}" text-anchor="middle" class="fx-cap" style="fill:#5BC0FF;animation-delay:.7s">요격!</text>`}
  if(f.m==='sup')g+=`<circle cx="${b[0]}" cy="${b[1]}" r="26" class="fx-sup" style="stroke:${col}"/><text x="${b[0]}" y="${b[1]-34}" text-anchor="middle" class="fx-plus" style="fill:#2E8FD0;animation-delay:.8s">제공권 확보</text>`;
  if(f.m==='hit'||f.m==='bomb'){for(let i=0;i<(f.m==='bomb'?5:3);i++){const ox=(i-1)*9+(i%2?4:-4),oy=(i%2?6:-5);g+=`<g transform="translate(${b[0]+ox},${b[1]+oy})"><circle r="9" class="fx-b1" style="animation-delay:${.75+i*.12}s"/><circle r="5" class="fx-b2" style="animation-delay:${.75+i*.12}s"/></g>`}
    g+=`<text x="${b[0]+14}" y="${b[1]-12}" class="fx-dmg" style="animation-delay:1.1s">${f.m==='bomb'?'폭격':'-'+f.d}</text>`;setTimeout(()=>sfx('boom'),800)}
  fxAdd(g+'</g>',2800)}
function ripple(t,col){const a=anc(t);if(!a)return;fxAdd(`<g transform="translate(${a[0]},${a[1]})">${[0,1,2].map(i=>`<circle r="10" class="fx-rip" style="stroke:${col};animation-delay:${i*.22}s"/>`).join('')}<g class="fx-flag"><path d="M0 0V-26" stroke="#3a2a10" stroke-width="2"/><path d="M0-26h15l-4 5 4 5H0z" style="fill:${col}" stroke="#fff" stroke-width="1"/></g></g>`,2400)}
function showBanner(text,kind){const b=document.getElementById('banner');if(!b)return;b.innerHTML=`<div class="bn ${kind||''}">${esc(text)}</div>`;clearTimeout(showBanner.t);showBanner.t=setTimeout(()=>{b.innerHTML=''},2600)}
function zoom(d){mz=Math.max(1,Math.min(2.2,+(mz+d).toFixed(2)));const w=document.querySelector('.mapwrap');const svg=document.getElementById('gmap');if(!svg||!w)return;
  const cx=(w.scrollLeft+w.clientWidth/2)/w.scrollWidth,cy=(w.scrollTop+w.clientHeight/2)/w.scrollHeight;svg.style.width=(100*mz)+'%';svg.style.minWidth=(760*mz)+'px';
  w.scrollLeft=cx*w.scrollWidth-w.clientWidth/2;w.scrollTop=cy*w.scrollHeight-w.clientHeight/2}
let drag=null,dragMoved=false;
function bindMap(){const w=document.querySelector('.mapwrap');const svg=document.getElementById('gmap');if(!w||!svg)return;
  svg.addEventListener('click',e=>{if(dragMoved){dragMoved=false;return}const t=e.target.closest&&e.target.closest('[data-t],[data-s]');if(!t)return;if(t.dataset.t!=null)clkL(+t.dataset.t);else clkS(+t.dataset.s)});
  w.addEventListener('mousedown',e=>{if(e.button!==0)return;drag={w,x:e.clientX,y:e.clientY,l:w.scrollLeft,t:w.scrollTop};dragMoved=false});
  w.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();zoom(e.deltaY<0?.2:-.2)},{passive:false})}
window.addEventListener('mousemove',e=>{if(!drag)return;const w=drag.w;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!dragMoved&&Math.hypot(dx,dy)<6)return;dragMoved=true;w.classList.add('drag');w.scrollLeft=drag.l-dx;w.scrollTop=drag.t-dy});
window.addEventListener('mouseup',()=>{if(drag){drag.w.classList.remove('drag');drag=null;setTimeout(()=>{dragMoved=false},0)}});

function selName(){return sel?sel.slice(2):null}
let airMode=null,nukeMode=false,nukeTgt=null;
// 출격 후 같은 임무를 할 수 있는 다음 대기 항공기로 자동 전환 (여러 대를 연달아 투입)
function nextPlane(m){const x=V.cur,af=V.N[x].airforce||[];if(m.sk==='sup'||m.sk==='strat')return null;
  for(let d=1;d<af.length;d++){const j=(m.i+d)%af.length;const p=af[j];if(p.cd===0&&airSkills(x,p.type).includes(m.sk))return{i:j,sk:m.sk}}return null}
function readyFor(sk){const x=V.cur;return(V.N[x].airforce||[]).filter(p=>p.cd===0&&airSkills(x,p.type).includes(sk)).length}
function airClick(nm){if(!myTurn()){airMode=null;nukeMode=false;return false}
  if(nukeMode){if(V.T[nm]&&V.T[nm].o!=='X'){nukeTgt=nm;render();return true}return false}
  if(airMode){if(airTargets(V,V.cur,airMode.sk).includes(nm)){if(airMode.sk==='strat'){airMode.t=nm;tab='nat';ntab='air';render();return true}
      sendAct({k:'sortie',i:airMode.i,sk:airMode.sk,t:nm});airMode=nextPlane(airMode);render();return true}}
  return false}
function curOpts(){if(airMode||nukeMode)return null;if(!myTurn()||!sel)return null;const nm=selName();const x=V.cur;
  if(sel[0]==='L'){const T=V.T[nm];if(T.o!==x)return null;const n=effCnt(T.u,pickMv);return landOpts(V,x,nm,n)}
  const S=V.S[nm];if(S.o!==x)return null;return seaOpts(V,x,nm,effCnt(S.u,pickMv))}
function eligible(us){return us.filter(u=>u.mv>0).length}
function effCnt(us){const e=eligible(us);if(!e)return 1;return cnt>0?Math.min(cnt,e):e}
function clkL(i){if(!V||V.ph==='lobby')return;const nm=LAND[i][0];if(airClick(nm))return;const o=curOpts();
  if(o&&o[nm]&&sel[0]==='L'){const k=o[nm].k;if(k==='mv'||k==='amv'||k==='vul'){const f=selName();const n=effCnt(V.T[f].u);sendAct({k:'go',f,to:nm,n});if(n>=eligible(V.T[f].u))sel='L:'+nm;cnt=0;tgt=null;render();return}
    tgt=nm;render();return}
  if(sel==='L:'+nm){sel=null;tgt=null;render();return}
  sel='L:'+nm;tgt=null;cnt=0;tab='act';render()}
function clkS(i){const nm=SEA[i][0];if(airClick(nm))return;const o=curOpts();
  if(o&&o[nm]&&sel[0]==='S'){const f=selName();const n=effCnt(V.S[f].u);if(o[nm].k==='mv'){sendAct({k:'go',f,to:nm,n});if(n>=eligible(V.S[f].u))sel='S:'+nm;cnt=0;render();return}tgt=nm;render();return}
  if(sel==='S:'+nm){sel=null;tgt=null;render();return}sel='S:'+nm;tgt=null;cnt=0;tab='act';render()}
function doAttack(){const f=selName();if(!tgt)return;const us=sel[0]==='L'?V.T[f].u:V.S[f].u;sendAct({k:'go',f,to:tgt,n:effCnt(us)});tgt=null;cnt=0}
function setCnt(n){cnt=n;tgt=null;render()}

/* ---- 게임 화면 ---- */

  const s=V;const x=s.cur;const mn=myNat();const opts=curOpts();const myT=myTurn();

    <div class="ztools"><button class="ghost sm" id="nightBtn" onclick="toggleNight()" aria-label="야경 보기">☾</button><button class="ghost sm" onclick="zoom(.3)" aria-label="확대">＋</button><button class="ghost sm" onclick="zoom(-.3)" aria-label="축소">－</button></div></div>
    <p class="note">내 영토를 누르면 갈 수 있는 곳은 <b style="color:var(--ok)">초록</b>, 칠 수 있는 곳은 <b style="color:var(--hot)">빨강</b>으로 깜빡입니다. 바다를 건너는 상륙은 점선 호로 이어집니다. 파란 선 = 강(건너면 이동 -1, 방어 +1), 산 모양 = 산, 물결 = 언덕, ★ = 수도, 굴뚝 = 공장. 부대 칩의 숫자는 부대 수, 금색 별은 특수 유닛, 빨간 점은 부상입니다. 지도는 끌어서 옮기고 ＋/－ 로 확대합니다.</p></div>

  $('#gbar').innerHTML=`<div class="bar"><span class="big">${turnTxt}</span><span id="tmr" class="stat" style="color:var(--hot)"></span><span style="flex:1"></span>
    ${mn?`<span><span class="flag" style="background:${MAPC[mn]}"></span><b>${NAT[mn].n}</b> 자원 <span class="stat">${s.N[mn].r}</span> <span class="note">(+${income(s,mn)})</span>${tutOn(s,'gov')?` · 자본 <span class="stat" style="color:var(--gold)">${s.N[mn].capital||0}</span> <span class="note">(+${capitalIncome(s,mn)})</span>`:''}${tutOn(s,'air')?` · 과학 <span class="stat" style="color:#2E8FD0">${s.N[mn].science||0}</span> <span class="note">(+${labCount(s,mn)})</span>`:''} · ${capBadge(s,mn)}</span>`:'<span class="note">관전 중</span>'}

  if(!ts.length)return'';if(!ts.includes(spyTo))spyTo=ts[0];const ok=myT&&(n.capital||0)>=SPY_COST;
  return`<div class="sheet" style="margin:0 0 10px;padding:10px 12px;border-color:#555"><span class="lab">🕵 첩보부 · 자본 ${SPY_COST}</span>
   <p class="note" style="margin:0 0 6px"><b style="color:var(--hot)">45% 실패(스파이 체포, 자본만 잃음)</b> · 38.5% 상대 국고에서 자본 10~20 탈취 · 8.25% 무작위 공장 1곳 파괴 · 8.25% 무작위 영토 인구 -1 (대상이 없으면 자본 탈취)</p>
   <div class="row"><select id="spyTo" onchange="spyTo=this.value">${ts.map(y=>`<option value="${y}" ${y===spyTo?'selected':''}>${NAT[y].n}</option>`).join('')}</select>
   <button class="sm ${ok?'':'ghost'}" ${ok?'':'disabled'} onclick="sendAct({k:'spy',t:spyTo})">스파이 파견</button></div></div>`}
function govPanel(x,myT){const s=V,n=s.N[x];const cap=n.capital||0;
  const mine=Object.keys(s.T).filter(k=>s.T[k].o===x).sort((a,b)=>popOf(s.T[b])-popOf(s.T[a]));
  const ws=Object.keys(WONDERS).filter(id=>hasWonder(s,x,id));
  return`<div class="sheet" style="margin:0 0 10px;padding:10px 12px;border-color:var(--gold)"><div class="row" style="justify-content:space-between"><span class="lab" style="margin:0">국고</span><span class="stat" style="font-size:18px;color:var(--gold)">자본 ${cap}</span></div>
   <p class="note" style="margin:4px 0 8px">매 턴 내 영토 인구 합만큼 자본이 들어옵니다 (지금 +${capitalIncome(s,x)}). 인구가 2 이상인 땅을 적에게 빼앗기면 약탈당해 인구 -1, 적은 자원 +${LOOT_RES}.</p>
   <div class="row"><button class="sm ${cap>=EMERG_COST&&myT&&!n.emU?'':'ghost'}" ${cap>=EMERG_COST&&myT&&!n.emU?'':'disabled'} onclick="sendAct({k:'emerg'})">비상금: 자본 ${EMERG_COST} → 자원 ${EMERG_GAIN}</button><span class="note">${n.emU?'이번 턴 사용함':'한 턴에 한 번'}</span></div></div>
  ${spySheet(x,myT)}
  ${ws.length?`<span class="lab">보유 불가사의</span><div class="col" style="gap:4px;margin-bottom:10px">${ws.map(id=>`<div class="fo"><div><b>${WONDERS[id].n}</b> <span class="note">${WONDERS[id].t}</span><br><span class="note">${WONDERS[id].d}</span></div></div>`).join('')}</div>`:''}
  <span class="lab">영토 인구 · 비용은 단계마다 올라갑니다 (${[2,3,4].map(q=>`→${q-1}단계 ${hasWonder(s,x,'eiffel')?Math.round(POP_COSTS[q]*.8):POP_COSTS[q]}`).join(' · ')})${hasWonder(s,x,'eiffel')?' · 에펠탑 20% 할인':''}</span>
  <div class="col" style="gap:4px">${mine.map(k=>{const p=popOf(s.T[k]);const pc=popCost(s,x,k);const ok=myT&&p<POP_MAX&&cap>=pc;return`<div class="row" style="justify-content:space-between"><span>${k} <span style="color:var(--gold)">${'●'.repeat(p)}${'○'.repeat(POP_MAX-p)}</span></span><button class="sm ${ok?'':'ghost'}" ${ok?'':'disabled'} onclick="sendAct({k:'pop',t:'${k}'})">${p>=POP_MAX?'최대':'+1 (자본 '+pc+')'}</button></div>`}).join('')}</div>
  <span class="lab" style="margin-top:10px">유럽의 불가사의</span><div class="note">${Object.entries(WONDERS).map(([id,w])=>{const o=s.T[w.t].o;return`${w.n}(${w.t}) — ${o==='N'?'중립':o==='X'?'없음':NAT[o].n}`}).join(' · ')}</div>`}
function pactIn(){if(!V||!V.pofs)return[];return V.pofs.filter(o=>myCtl(o.t))}
function incoming(){if(!V||!V.trades)return[];return V.trades.filter(o=>myCtl(o.t))}
function tradeDesc(o){const g=[o.gr?'자원 '+o.gr:'',o.gt||''].filter(Boolean).join(' + ')||'없음',r=[o.rr?'자원 '+o.rr:'',o.rt||''].filter(Boolean).join(' + ')||'없음';
  return`<b>${NAT[o.f].n}</b>이(가) 줌: ${esc(g)} · 대가: ${esc(r)}`}
let trTo='';
function tradePanel(x){const s=V;const others=Object.keys(s.N).filter(y=>y!==x&&['on','puppet'].includes(s.N[y].st));
  if(!others.length)return'<p class="note">거래할 다른 강대국이 없습니다.</p>';if(!others.includes(trTo))trTo=others[0];
  const tradable=o=>Object.keys(s.T).filter(k=>s.T[k].o===o&&!s.T[k].u.length&&NAT[o].cap!==k);
  const rel=y=>teamOf(s,x)===teamOf(s,y)?'같은 편':atWar(s,x,y)?'전쟁 중':warState(s,x,y)===1?'선포함':'평화';
  const inc=s.trades.filter(o=>o.t===x),out=s.trades.filter(o=>o.f===x);
  return`${inc.length?`<span class="lab">받은 제안</span>${inc.map(o=>`<div class="fo"><div>${tradeDesc(o)}<br><span class="note">R${o.rd} 제안 · 2라운드 지나면 만료</span></div><div class="row"><button class="sm" onclick="sendAct({k:'tacc',id:${o.id}})">수락</button><button class="sm ghost" onclick="sendAct({k:'tdec',id:${o.id}})">거절</button></div></div>`).join('')}`:''}
  <span class="lab" style="margin-top:10px">거래 제안 · 적국과도 가능</span>
  <div class="col" style="gap:6px"><label class="row">상대 <select id="trTo" onchange="trTo=this.value;render()">${others.map(y=>`<option value="${y}" ${y===trTo?'selected':''}>${NAT[y].n} (${rel(y)})</option>`).join('')}</select></label>
  <div class="row"><label>내가 줄 자원 <input id="trGr" type="number" min="0" max="999" value="0" style="width:70px"></label><label>받을 자원 <input id="trRr" type="number" min="0" max="999" value="0" style="width:70px"></label></div>
  <label class="row">내가 줄 영토 <select id="trGt"><option value="">없음</option>${tradable(x).map(k=>`<option>${k}</option>`).join('')}</select></label>
  <label class="row">받을 영토 <select id="trRt"><option value="">없음</option>${tradable(trTo).map(k=>`<option>${k}</option>`).join('')}</select></label>
  <button class="sm" onclick="sendAct({k:'trade',from:'${x}',to:trTo,gr:$('#trGr').value,rr:$('#trRr').value,gt:$('#trGt').value,rt:$('#trRt').value})">제안 보내기</button>
  <p class="note">병력이 없는 영토만 넘길 수 있고 수도는 거래할 수 없습니다. 상대는 자기 차례가 아니어도 언제든 수락할 수 있습니다. 동맹 지원과 달리 금액 제한이 없습니다.</p></div>
  ${out.length?`<span class="lab" style="margin-top:10px">보낸 제안</span>${out.map(o=>`<div class="fo"><div>→ ${NAT[o.t].n}: ${tradeDesc(o)}</div><button class="sm ghost" onclick="sendAct({k:'tcan',id:${o.id}})">취소</button></div>`).join('')}`:''}`}
function worldPanel(){const s=V;const rows=ORDER.filter(x=>s.N[x]).map(x=>{const n=s.N[x];const f=facOf(s,x);
  return`<tr><td><span class="flag" style="background:${NAT[x].c}"></span>${NAT[x].n}</td><td>${n.st==='puppet'?'괴뢰('+NAT[n.m].n+')':n.st==='on'?affName(s,x):n.st==='annexed'?'병합됨':'몰락'}</td><td class="stat">${landCount(s,x)}</td><td class="stat">${n.r}</td><td class="note">${s.seats[x]?esc(nickOf(s.seats[x]))+(s.on[x]?'':' ✕'):'자동'}${mode==='guest'&&!s.on[x]&&!mySeats().length&&['on','puppet'].includes(n.st)?` <button class="sm ghost" onclick="wantSeat('${x}')">이어받기</button>`:''}</td></tr>`}).join('');
  const neu=Object.keys(s.T).filter(k=>s.T[k].o==='N').length;
  const wars=Object.entries(s.war).map(([k,r])=>`${k.split('|').map(y=>NAT[y].n).join(' ⚔ ')} <span class="note">(R${r} 선포${r<s.rd?'':' · 준비 중'})</span>`);
  return`<table class="tbl"><tr><th>나라</th><th>진영</th><th>영토</th><th>자원</th><th>플레이어</th></tr>${rows}</table>
  <p class="note">남은 중립국 ${neu}곳 · 관전자 ${(s.wt||[]).length}명</p><span class="lab">전쟁</span><div style="font-size:14px">${wars.length?wars.join('<br>'):'<span class="note">아직 강대국 사이의 전쟁은 없습니다.</span>'}</div>`}
boot();
</script>
